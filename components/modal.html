<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-form">
      <div class="modal-title">Join the Waitlist</div>
      <p class="modal-sub">Be the first to access AOSEP when we launch our beta in Algeria.</p>
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Wilaya (City)</label>
        <input type="text" class="form-input" placeholder="e.g. Algiers, Batna, Oran...">
      </div>
      <div class="form-group">
        <label class="form-label">I am a...</label>
        <select class="form-select">
          <option>High School Student</option>
          <option>University Student</option>
          <option>Recent Graduate</option>
          <option>Self-Learner</option>
          <option>Professional</option>
          <option>Mentor / Educator</option>
        </select>
      </div>
      <button class="form-submit" onclick="submitForm()">Join Waitlist →</button>
      <p class="form-note">🔒 No spam. We'll notify you when beta access opens.</p>
    </div>
    <div class="success-msg" id="success-msg">
      <span class="check">✅</span>
      <h3>You're on the list!</h3>
      <p>We'll reach out when beta access opens. Welcome to the AOSEP community.</p>
    </div>
  </div>
</div>
